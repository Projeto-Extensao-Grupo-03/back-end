spring.application.name=Projeto

# =============================================================================
# CONFIGURAÇÕES DO BANCO DE DADOS (MYSQL)
# =============================================================================
# Substitua 'meu_banco', 'root' e 'sua_senha' pelos dados reais do seu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/meu_banco?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sua_senha
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pooling Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# =============================================================================
# CONFIGURAÇÕES JWT
# =============================================================================
jwt.validity=${JWT_VALIDITY:3600}
jwt.secret=${JWT_SECRET:}

# =============================================================================
# CONFIGURAÇÕES DO SWAGGER / SPRINGDOC
# =============================================================================
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha